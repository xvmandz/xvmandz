# HTTPS virtual host example. Adapt paths and certificates for your host.
<VirtualHost *:443>
    ServerName pingup.example.com
    DocumentRoot /var/www/pingup/public
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/pingup.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/pingup.example.com/privkey.pem
    <Directory /var/www/pingup/public>
        Options -Indexes
        AllowOverride FileInfo Limit Options
        Require all granted
    </Directory>
</VirtualHost>

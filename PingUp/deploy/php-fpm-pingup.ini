; PHP-FPM settings for PingUp 2.1 (e.g. /etc/php/8.3/fpm/conf.d/90-pingup.ini).
; Large files (50 MB / 200 MB Premium) are uploaded in 8 MB chunks, so request limits stay small
; and PHP never buffers a whole file in memory.
upload_max_filesize = 16M
post_max_size = 20M
max_execution_time = 60
memory_limit = 128M
expose_php = Off
display_errors = Off
log_errors = On
opcache.enable = 1

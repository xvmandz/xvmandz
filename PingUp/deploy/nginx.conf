# Adapt domain, certificate and PHP-FPM socket for your host.
server {
    listen 80;
    server_name pingup.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name pingup.example.com;
    ssl_certificate /etc/letsencrypt/live/pingup.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pingup.example.com/privkey.pem;
    root /var/www/pingup/public;
    index index.php;
    client_max_body_size 12m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /sw.js {
        add_header Cache-Control "no-store" always;
        add_header Service-Worker-Allowed "/" always;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ ^/(index|api|media)\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
    location ~* \.(?:css|js|svg|woff2|json|png|wav)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
